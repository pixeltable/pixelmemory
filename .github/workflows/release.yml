name: Release

# Publishing is a tag push:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# No token anywhere. PyPI Trusted Publishing mints a short-lived credential from
# this workflow's OIDC identity, so there is no long-lived PYPI_API_KEY to leak,
# rotate, or paste into a shell. The previous scripts/release.sh read one out of
# ~/.pixeltable/config.toml.
#
# One-time setup on PyPI (Manage project -> Publishing -> add a GitHub publisher):
#   owner: pixeltable   repository: pixelmemory
#   workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version in pyproject.toml must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag pyproject=$pyproject"
          if [ "$tag" != "$pyproject" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $pyproject."
            exit 1
          fi

      - run: uv build

      - name: Check the artifacts
        run: |
          uv tool run twine check dist/*
          ls -la dist/

      # A release that cannot be installed is worse than no release. This is the
      # same check that caught the 0.1.x breakage: install the actual artifact
      # against the newest pixeltable our bound allows, then build an agent.
      - name: Install the built wheel and smoke-test it
        env:
          PIXELTABLE_HOME: ${{ runner.temp }}/pxt-release
        run: |
          uv venv /tmp/verify --python 3.12
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          uv pip check --python /tmp/verify/bin/python
          uv pip list --python /tmp/verify/bin/python | grep -E "pixelmemory|pixeltable"
          /tmp/verify/bin/python -I -c "
          from pathlib import Path
          import sys
          import pixelmemory
          assert Path(pixelmemory.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), pixelmemory.__file__
          from pixelmemory import Memory
          from pixelmemory.context import Text
          m = Memory([Text(id='body', embed=False)], namespace='release_check')
          assert m.table.columns() == ['body'], m.table.columns()
          m.add(m.Entry(body='persisted from the built wheel'))
          m = Memory([Text(id='body', embed=False)], namespace='release_check')
          assert m.table.collect()[0]['body'] == 'persisted from the built wheel'
          print('built wheel installs, inserts and reopens a memory')
          "

      - name: Test the installed wheel
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes -o /tmp/dev-requirements.txt
          uv pip install --python /tmp/verify/bin/python -r /tmp/dev-requirements.txt
          uv pip check --python /tmp/verify/bin/python
          cd "$RUNNER_TEMP"
          /tmp/verify/bin/python -I -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml" -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    # The environment gives you a required-reviewer gate if you want one:
    # Settings -> Environments -> pypi -> Required reviewers.
    environment:
      name: pypi
      url: https://pypi.org/p/pixelmemory
    permissions:
      id-token: write # mints the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
