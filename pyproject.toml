[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pixelmemory"
version = "0.1.0"
description = "Multimodal Memory for AI Agents and MCP."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pixeltable, Inc.", email = "contact@pixeltable.com" }]
keywords = [
    "data-science", "machine-learning", "database", "ai", "computer-vision",
    "chatbot", "ml", "artificial-intelligence", "feature-engineering", "multimodal",
    "mlops", "feature-store", "vector-database", "llm", "genai"
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pixeltable>=0.7.6,<0.8",
    "sentence-transformers>=4.1.0",
    # DocumentSplitterParams defaults to separators="token_limit", which needs tiktoken.
    "tiktoken>=0.7",
]

[project.urls]
homepage = "https://pixeltable.com/"
repository = "https://github.com/pixeltable/pixelmemory"
documentation = "https://docs.pixeltable.com/docs/libraries/pixelmemory"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12.2,<0.15",
    # Provider SDKs are optional at runtime (pixelmemory raises a clear ImportError
    # if you use an Image context without them), but CI must cover the vision paths.
    "openai>=1.0",
    "anthropic>=0.40",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pinned explicitly so CI does not change meaning when ruff changes its defaults.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = false
# The iterator and vision migrations are verified, not asserted: any surviving
# deprecated Pixeltable call fails the suite.
filterwarnings = [
    "error::pixeltable.exceptions.PixeltableDeprecationWarning",
]
